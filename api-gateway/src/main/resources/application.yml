server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: investigadores-route
              uri: lb://investigadores-service
              predicates:
                - Path=/api/investigadores/**
            - id: publicaciones-route
              uri: lb://publicaciones-service
              predicates:
                - Path=/api/publicaciones/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clavePorIp}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
            - id: estado-route
              uri: lb://publicaciones-service
              predicates:
                - Path=/api/status

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health, info, gateway
