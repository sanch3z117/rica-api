services:
  rica-db:
    image: postgres:16
    container_name: rica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rica
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
    ports:
      - "5432:5432"
    volumes:
      - rica-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rica -d rica"]
      interval: 5s
      timeout: 5s
      retries: 10

  rica-mongo:
    image: mongo:7
    container_name: rica-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: rica
    ports:
      - "27017:27017"
    volumes:
      - rica-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic investigadores-eventos --partitions 3 --replication-factor 1"]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  investigadores-service:
    build:
      context: .
      dockerfile: investigadores-service/Dockerfile
    container_name: investigadores-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://rica-db:5432/rica
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      rica-db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

  publicaciones-service:
    build:
      context: .
      dockerfile: publicaciones-service/Dockerfile
    container_name: publicaciones-service
    restart: unless-stopped
    environment:
      SPRING_MONGODB_URI: mongodb://rica-mongo:27017/rica
      RICA_INVESTIGADORES_BASE_URL: http://investigadores-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      rica-mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
      investigadores-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_started
      investigadores-service:
        condition: service_started
      publicaciones-service:
        condition: service_started

  rica-frontend:
    build:
      context: ../rica-frontend
    container_name: rica-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  rica-db-data:
  rica-mongo-data:
