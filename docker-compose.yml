services:
  rica-db:
    image: postgres:16
    container_name: rica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rica
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
    ports:
      - "5432:5432"
    volumes:
      - rica-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rica -d rica"]
      interval: 5s
      timeout: 5s
      retries: 10

  rica-mongo:
    image: mongo:7
    container_name: rica-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: rica
    ports:
      - "27017:27017"
    volumes:
      - rica-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  investigadores-service:
    build:
      context: .
      dockerfile: investigadores-service/Dockerfile
    container_name: investigadores-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://rica-db:5432/rica
    ports:
      - "8081:8081"
    depends_on:
      rica-db:
        condition: service_healthy

  publicaciones-service:
    build:
      context: .
      dockerfile: publicaciones-service/Dockerfile
    container_name: publicaciones-service
    restart: unless-stopped
    environment:
      SPRING_MONGODB_URI: mongodb://rica-mongo:27017/rica
      RICA_INVESTIGADORES_BASE_URL: http://investigadores-service:8081
    ports:
      - "8082:8082"
    depends_on:
      rica-mongo:
        condition: service_healthy
      investigadores-service:
        condition: service_started

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: unless-stopped
    environment:
      INVESTIGADORES_UPSTREAM: http://investigadores-service:8081
      PUBLICACIONES_UPSTREAM: http://publicaciones-service:8082
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      - investigadores-service
      - publicaciones-service

  rica-frontend:
    build:
      context: ../rica-frontend
    container_name: rica-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  rica-db-data:
  rica-mongo-data:
