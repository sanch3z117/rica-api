name: CI

on:
  push:
    branches:
      - main
      - 'taller-*'
  pull_request:

jobs:
  build:
    name: Compilar y probar ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio:
          - eureka-server
          - investigadores-service
          - publicaciones-service
          - consultas-service
          - api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Pruebas de ${{ matrix.servicio }} con mvnw
        run: ./mvnw -B -pl ${{ matrix.servicio }} -am test
